name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Oyunu derle
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: APK üret
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../caglar-boyu-insan.apk

      - name: İndirme linkini güncelle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete son-surum --cleanup-tag -y || true
          gh release create son-surum caglar-boyu-insan.apk \
            --target "$GITHUB_SHA" \
            --title "Son sürüm (derleme #${{ github.run_number }})" \
            --notes "Telefona kurmak için caglar-boyu-insan.apk dosyasını indir. Derleme: #${{ github.run_number }}"
